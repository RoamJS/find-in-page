name: Validate Extension (PR)
on: pull_request

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --reporter=line
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build without publishing
        # --dry skips GitHub releases, uploads, and the inherited Depot PR hook.
        run: npx --no-install samepage build --dry
